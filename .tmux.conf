# ============================================
# GENERAL / ESSENTIAL SETTINGS
# ============================================

set -g mouse on
set -g history-limit 50000

# Start indexing at 1 (more natural)
set -g base-index 1
setw -g pane-base-index 1

# Improve escape timing (feels better in vim/neovim)
set -s escape-time 10

# Better terminal support (safer than xterm-256color alone)
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-256color:clipboard"


# ============================================
# APPEARANCE (minimal + readable)
# ============================================

set -g pane-border-style fg=colour235
set -g pane-active-border-style fg=colour240

set -g status-style bg=default,fg=white
set -g status-right "%H:%M"
set -g status-left ""

set -g window-status-current-style fg=green,bold


# ============================================
# KEY BINDINGS (modern workflow)
# ============================================

# Prefix (clean + standard)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Splits (keep working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (hold prefix + HJKL)
bind -r H resize-pane -L 5
bind -r L resize-pane -R 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5

# Reload config
bind r source-file ~/.tmux.conf \; display-message "tmux reloaded"


# ============================================
# PLUGINS (TPM)
# ============================================

set -g @plugin tmux-plugins/tpm
set -g @plugin tmux-plugins/tmux-sensible

# Optional but useful
set -g @plugin tmux-plugins/tmux-resurrect

# CONTINUUM can be annoying on shared machines → optional
# set -g @plugin tmux-plugins/tmux-continuum
# set -g @continuum-restore on

set -g @resurrect-strategy-vim session


# ============================================
# TPM BOOTSTRAP (safe + modern)
# ============================================

run ~/.tmux/plugins/tpm/tpm
